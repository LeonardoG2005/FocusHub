<div class="nav-shortcuts">
    <div class="nav-user">
        <i class="fa-solid fa-circle-user nav-user-icon" aria-hidden="true"></i>
        <div class="nav-user-text">
            <div class="nav-user-name">{{ authService.getCurrentUserName() || 'Usuario' }}</div>
            <div class="nav-user-email">{{ authService.getCurrentUserEmail() || '' }}</div>
        </div>
    </div>

    <a [routerLink]="['/tasks']" routerLinkActive="active">
        <i class="fa-solid fa-list-check" aria-hidden="true"></i> Tareas
    </a>
    <a [routerLink]="['/calendar']" routerLinkActive="active">
        <i class="fa-solid fa-calendar-alt" aria-hidden="true"></i> Calendario
    </a>
    <a [routerLink]="['/techniques']" routerLinkActive="active">
        <i class="fa-solid fa-brain" aria-hidden="true"></i> Técnicas
    </a>
    <a [routerLink]="['/stats']" routerLinkActive="active">
        <i class="fa-solid fa-chart-line" aria-hidden="true"></i> Estadísticas
    </a>
    <button (click)="modetoggle()" class="theme-toggle-button">
        <i class="fa-solid" [class.fa-sun]="darkmode" [class.fa-moon]="!darkmode" aria-hidden="true"></i>
    </button>
    <a (click)="logout()" id="logoutBtn" routerLinkActive="active">
        <i class="fa-solid fa-sign-out-alt" aria-hidden="true"></i> Salir
    </a>
</div>
